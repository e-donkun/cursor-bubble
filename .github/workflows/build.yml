name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン（例: v1.0.0）。空欄ならビルドのみ'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the csc.exe that ships with Windows
        shell: cmd
        run: call build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: CursorBubble
          path: CursorBubble.exe
          if-no-files-found: error

      # v1.0.0 のようなタグを push するか、手動実行で version を指定すると、
      # exe を添付したリリースを作成する
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$env:VERSION" CursorBubble.exe --target "$env:GITHUB_SHA" --title "CursorBubble $env:VERSION" --generate-notes
