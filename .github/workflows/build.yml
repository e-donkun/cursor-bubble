name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the csc.exe that ships with Windows
        shell: cmd
        run: call build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: CursorBubble
          path: CursorBubble.exe
          if-no-files-found: error

      # v1.0.0 のようなタグを push すると、exe を添付したリリースを作成する
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" CursorBubble.exe --title "CursorBubble $env:GITHUB_REF_NAME" --generate-notes
