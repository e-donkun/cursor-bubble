name: screenshots

# README 用のスクリーンショットを、実際にアプリを動かして撮り直す（手動実行）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: call build.bat

      - name: Capture
        shell: powershell
        run: .\tools\screenshots.ps1

      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update screenshots"
          git push
